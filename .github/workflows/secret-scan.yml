name: Secret Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual triggers
  schedule:
    # Run weekly scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  scan:
    name: Scan for secrets
    # Dependabot-triggered runs don't get repository secrets: GITLEAKS_LICENSE
    # resolves empty and gitleaks-action aborts before scanning (org repos
    # require a license). Dependabot only edits manifests, and the push to
    # main after merge is scanned anyway, so skipping bot PRs loses nothing.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for comprehensive scanning
      
      - name: Run Gitleaks scan
        id: gitleaks
        continue-on-error: true   # so the reporting steps below always run
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro features
          # Apply the repo's allowlist explicitly. .gitleaks.toml exists and is
          # used by the .git-hooks/pre-commit hook, but was never passed to the
          # action — so the scheduled scan ran against stock rules while local
          # commits ran against the tuned ones.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      # Classify the outcome so the two alert paths below can't both stay
      # silent. The scan failed every Sunday for six weeks (2026-07-05 through
      # 2026-08-09) and nothing was posted, because every reporting step was
      # gated on `hashFiles('results.sarif') != ''` — when gitleaks exits
      # non-zero WITHOUT writing a report, all of them were skipped and the
      # failure existed only as a red X nobody was watching.
      - name: Classify scan outcome
        id: classify
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then
            echo "state=clean" >> $GITHUB_OUTPUT
          elif [ -f results.sarif ]; then
            COUNT=$(python3 -c "import json;print(len(json.load(open('results.sarif'))['runs'][0].get('results',[])))" 2>/dev/null || echo "?")
            echo "state=leaks" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            # Non-zero exit with no report: license, network, config or action
            # error. Still needs a human — silence here is the actual bug.
            echo "state=broken" >> $GITHUB_OUTPUT
          fi
          echo "Scan state: $(grep '^state=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2)"

      - name: Upload scan results
        if: always() && steps.classify.outputs.state == 'leaks'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: results.sarif
          retention-days: 7

      - name: Notify on secret detection
        if: always() && steps.classify.outputs.state == 'leaks'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#web",
              "username": "Security Alert",
              "icon_emoji": ":rotating_light:",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🚨 SECURITY ALERT: Secrets Detected in Repository",
                  "text": "Gitleaks found ${{ steps.classify.outputs.count || 'one or more' }} potential secret(s). Review and rotate anything exposed.",
                  "fields": [
                    {
                      "title": "Findings",
                      "value": "${{ steps.classify.outputs.count || 'unknown' }}",
                      "short": true
                    },
                    {
                      "title": "Scan scope",
                      "value": "${{ github.event_name == 'schedule' && 'Full history (weekly)' || 'Push/PR diff' }}",
                      "short": true
                    },
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Triggered By",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<${{ github.event.head_commit.url || github.event.pull_request.html_url }}|View>",
                      "short": true
                    }
                  ],
                  "footer": "Review the workflow logs immediately and rotate any exposed credentials",
                  "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "actions": [
                    {
                      "type": "button",
                      "text": "View Scan Results",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # The alert that didn't exist. A scanner that fails without saying so is
      # worse than no scanner: it reads as green. This fires when gitleaks
      # exits non-zero but produces no report — license expiry, network,
      # bad config, action breakage.
      - name: Notify on scan failure (no report produced)
        if: always() && steps.classify.outputs.state == 'broken'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#web",
              "username": "Security Alert",
              "icon_emoji": ":warning:",
              "attachments": [
                {
                  "color": "warning",
                  "title": "⚠️ Secret scan FAILED to run — repo is unscanned",
                  "text": "Gitleaks exited non-zero without producing a report, so this run proves nothing about the repo's state. Likely causes: GITLEAKS_LICENSE expired, network failure, or an invalid .gitleaks.toml.",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Trigger",
                      "value": "${{ github.event_name }}",
                      "short": true
                    }
                  ],
                  "footer": "Unscanned ≠ clean — check the run log",
                  "actions": [
                    {
                      "type": "button",
                      "text": "View Run",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }

      # Re-assert the real outcome. The scan step is continue-on-error so the
      # notifications above always get a chance to fire; the job itself must
      # still fail, or a leak would show up as a green check.
      - name: Fail the job if the scan did not come back clean
        if: always() && steps.classify.outputs.state != 'clean'
        run: |
          echo "::error::Secret scan state: ${{ steps.classify.outputs.state }}"
          exit 1
