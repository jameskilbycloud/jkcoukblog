name: Python Checks

# Lint + unit tests for the build scripts (Python, and the shell in
# scripts/ci/ that deploy-static-site.yml runs). Separate from
# quality-checks.yml, which checks the deployed site.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'scripts/**.sh'
      - '*.sh'
      - '_worker.template.js'
      - 'tests/**'
      - 'requirements*.txt'
      - 'ruff.toml'
      - '.github/workflows/python-checks.yml'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'scripts/**.sh'
      - '*.sh'
      - '_worker.template.js'
      - 'tests/**'
      - 'requirements*.txt'
      - 'ruff.toml'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: |
          ruff check scripts/ tests/

      # Warning level: the scripts/ci/ bodies came out of the deploy workflow,
      # and errors there used to surface only as a failed deploy.
      # (shellcheck is preinstalled on ubuntu-latest.)
      - name: ShellCheck
        run: |
          shellcheck -S warning scripts/*.sh scripts/ci/*.sh ./*.sh

      - name: Run unit tests
        run: |
          pytest tests/ -v

      # The Worker's own tests (the /api/sizer/* access control above all).
      # Node's built-in runner, preinstalled on ubuntu-latest — no npm deps.
      - name: Worker tests
        run: |
          node --test tests/worker/
