name: Rollback Site to Previous Deployment

# The built site is a single force-pushed commit on the site branch, so there
# is no git history to reset. Cloudflare Pages keeps every deployment, so roll
# back there instead: by default to the production deployment before the one
# that's live, or to a specific deployment ID.
#
# The rollback only lasts until the next deploy-static-site.yml run, which
# rebuilds from main. Revert the change that broke the site on main first.

on:
  workflow_dispatch:        # Manual trigger only
    inputs:
      deployment_id:
        description: 'Cloudflare Pages deployment ID to roll back to (blank = the one before the live deployment)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rollback:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ID: ${{ github.event.inputs.deployment_id }}

    steps:
    - name: Pick the deployment to roll back to
      run: |
        set -euo pipefail
        API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/jkcoukblog"
        AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

        CURRENT_ID=$(curl -sf -H "$AUTH" "$API" | jq -r '.result.canonical_deployment.id')
        DEPLOYS=$(curl -sf -H "$AUTH" "$API/deployments?env=production&per_page=25")
        echo "📌 Live deployment: $CURRENT_ID"

        if [ -z "$TARGET_ID" ]; then
          # Deployments come newest first: take the first successful one
          # listed after the live deployment.
          TARGET_ID=$(printf '%s' "$DEPLOYS" | jq -r --arg cur "$CURRENT_ID" '
            [.result[]] | (map(.id) | index($cur)) as $i
            | if $i == null then empty else .[$i+1:][] end
            | select(.latest_stage.name == "deploy" and .latest_stage.status == "success") | .id' | head -1)
        fi
        if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "$CURRENT_ID" ]; then
          echo "❌ No earlier successful production deployment to roll back to"
          exit 1
        fi

        printf '%s' "$DEPLOYS" | jq -r --arg id "$TARGET_ID" \
          '.result[] | select(.id == $id) | "📋 Rolling back to \(.id) — \(.created_on), site@\(.deployment_trigger.metadata.commit_hash[0:7])"'
        echo "CURRENT_ID=$CURRENT_ID" >> "$GITHUB_ENV"
        echo "TARGET_ID=$TARGET_ID" >> "$GITHUB_ENV"

    - name: Perform rollback
      run: |
        set -euo pipefail
        RESP=$(curl -s -X POST \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/jkcoukblog/deployments/$TARGET_ID/rollback")
        if [ "$(printf '%s' "$RESP" | jq -r '.success')" != "true" ]; then
          echo "❌ Rollback failed: $(printf '%s' "$RESP" | jq -c '.errors')"
          exit 1
        fi
        echo "✅ Production now serves deployment $TARGET_ID"

    # The worker's KV HTML cache still holds pages rendered from the rolled-back
    # deployment; clear it so visitors get the restored version.
    - name: Purge KV HTML cache
      continue-on-error: true
      run: |
        if [ -z "${{ secrets.CACHE_PURGE_TOKEN }}" ]; then
          echo "ℹ️  CACHE_PURGE_TOKEN not set — KV cache entries expire on their own TTL"
          exit 0
        fi
        curl -sf -X POST "https://jameskilby.co.uk/.purge?all=true" \
          -H "X-Purge-Token: ${{ secrets.CACHE_PURGE_TOKEN }}" | jq -r '"🗑️  Purged \(.count // 0) KV entries"'

    - name: Generate summary
      run: |
        echo "## ⏮️ Rollback Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Successfully rolled back" >> $GITHUB_STEP_SUMMARY
        echo "- **Rolled back from:** \`${{ env.CURRENT_ID }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Now serving:** \`${{ env.TARGET_ID }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Note:** the next deploy rebuilds from main — revert the bad change there first" >> $GITHUB_STEP_SUMMARY

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "channel": "#web",
            "username": "GitHub Actions",
            "icon_emoji": ":github:",
            "attachments": [
              {
                "color": "warning",
                "title": "⏮️ jkcoukblog Site Rolled Back",
                "text": "Production was rolled back to an earlier Cloudflare Pages deployment.",
                "fields": [
                  {
                    "title": "Rolled back from",
                    "value": "${{ env.CURRENT_ID }}",
                    "short": true
                  },
                  {
                    "title": "Now serving",
                    "value": "${{ env.TARGET_ID }}",
                    "short": true
                  },
                  {
                    "title": "Triggered by",
                    "value": "${{ github.actor }}",
                    "short": true
                  }
                ],
                "footer": "The next deploy rebuilds from main — revert the bad change there first",
                "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                "actions": [
                  {
                    "type": "button",
                    "text": "View Workflow",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "channel": "#web",
            "username": "GitHub Actions",
            "icon_emoji": ":github:",
            "attachments": [
              {
                "color": "danger",
                "title": "❌ jkcoukblog Rollback Failed",
                "text": "Failed to roll back the site to an earlier deployment!",
                "fields": [
                  {
                    "title": "Triggered by",
                    "value": "${{ github.actor }}",
                    "short": true
                  }
                ],
                "footer": "Please check the GitHub Actions logs for details",
                "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                "actions": [
                  {
                    "type": "button",
                    "text": "View Workflow Logs",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
