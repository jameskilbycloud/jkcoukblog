name: WordPress to Static Site Deploy

on:
  workflow_dispatch:        # Manual trigger
    inputs:
      force_static_purge:
        # When the build doesn't change a file under purge_static_cache.sh's
        # URL list, the purge step is skipped — but the CF edge cache for
        # those files may have been invalidated separately (e.g. subset_fonts
        # rewrote a font in a prior deploy that didn't fire the purge gate).
        # Setting this to "true" forces the purge to run on this dispatch
        # regardless of the diff.
        description: 'Force the static-asset CF purge even if nothing changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      reencode_images:
        # Re-encode every AVIF/WebP from its source instead of reusing the
        # previous build's (optimize_images.py --force). Only for an encoder
        # or quality change: it takes most of the 40-minute image budget.
        # force-full-deploy.yml exposes the same input.
        description: 'Re-encode every image (encoder/quality change only — slow)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  repository_dispatch:      # Webhook trigger
    types: [wordpress-update]

# Org defaults GITHUB_TOKEN to read-only; this workflow pushes the generated
# site to the site branch (and build caches to main), so it must explicitly
# grant contents: write.
permissions:
  contents: write
  actions: write   # dispatch quality-checks.yml after a successful deploy

# Prevent concurrent runs of this workflow
concurrency:
  group: wordpress-static-site-deploy
  cancel-in-progress: false  # Don't cancel running jobs, wait for completion

jobs:
  spell-check:
    runs-on: self-hosted
    needs: [build-and-deploy]  # Run after deploy so the heavy build doesn't share the runner (#11)
    timeout-minutes: 15  # Prevent hanging spell checks
    continue-on-error: true  # Don't fail the workflow if spell check fails
    steps:
    - name: Validate required environment variables
      run: |
        echo "🔍 Validating required environment variables..."
        MISSING_VARS=()
        
        # Check for required secrets
        if [ -z "${{ secrets.WP_AUTH_TOKEN }}" ]; then
          MISSING_VARS+=("WP_AUTH_TOKEN")
        fi
        
        if [ -z "${{ secrets.OLLAMA_API_CREDENTIALS }}" ]; then
          MISSING_VARS+=("OLLAMA_API_CREDENTIALS")
        fi
        
        # Report results
        if [ ${#MISSING_VARS[@]} -gt 0 ]; then
          echo "❌ Missing required environment variables:"
          for var in "${MISSING_VARS[@]}"; do
            echo "  - $var"
          done
          echo ""
          echo "📝 Please configure these secrets in repository settings:"
          echo "   Settings > Secrets and variables > Actions"
          exit 1
        else
          echo "✅ All required environment variables are set"
          echo "  ✓ WP_AUTH_TOKEN"
          echo "  ✓ OLLAMA_API_CREDENTIALS"
        fi
    
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0  # Fetch full history
      
    - name: Restore spell check cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .last_spell_check_timestamp
        key: spell-check-${{ github.sha }}
        restore-keys: |
          spell-check-
      
    - name: Install dependencies
      run: |
        # pip and system packages already installed by build-and-deploy on this runner (#14).
        # This job `needs` build-and-deploy and runs on the same self-hosted runner, so a
        # probe import is enough — only reinstall if the environment is somehow missing them.
        echo "🔧 Ensuring Python dependencies are installed..."
        if python3 -c "import requests, bs4" 2>/dev/null; then
          echo "✅ Dependencies already present on this runner — skipping pip install"
        else
          python3 -m pip install -r requirements.txt --break-system-packages --quiet
        fi

    - name: Run spell check
      env:
        WP_AUTH_TOKEN: ${{ secrets.WP_AUTH_TOKEN }}
        OLLAMA_API_CREDENTIALS: ${{ secrets.OLLAMA_API_CREDENTIALS }}
        OLLAMA_URL: https://ollama.jameskilby.cloud
        OLLAMA_MODEL: llama3.1:8b
      run: |
        echo "📝 Running spell check on modified posts..."
        
        # Read last check timestamp from file (if exists)
        TIMESTAMP_FILE=".last_spell_check_timestamp"
        if [ -f "$TIMESTAMP_FILE" ]; then
          LAST_CHECK=$(cat "$TIMESTAMP_FILE")
          echo "📅 Last check: $LAST_CHECK"
          export SINCE_TIMESTAMP="$LAST_CHECK"
        else
          echo "📅 No previous check found, checking last 3 posts"
        fi
        
        # Run spell checker (only checks posts modified since SINCE_TIMESTAMP if set)
        SPELL_EXIT=0
        if [ -n "$SINCE_TIMESTAMP" ]; then
          python3 scripts/ollama_spell_checker.py || SPELL_EXIT=$?
        else
          python3 scripts/ollama_spell_checker.py 3 || SPELL_EXIT=$?
        fi

        if [ "$SPELL_EXIT" -ne 0 ]; then
          echo "⚠️  Spelling issues detected (non-blocking)"
          SPELL_STATUS="⚠️ Issues detected"
        else
          SPELL_STATUS="✅ No issues found"
        fi

        # Save current timestamp for next run
        date -u +"%Y-%m-%dT%H:%M:%SZ" > "$TIMESTAMP_FILE"
        echo "💾 Saved timestamp for next check"

        # Save spell check summary
        echo "## 📝 Spell Check Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** $SPELL_STATUS" >> $GITHUB_STEP_SUMMARY
        echo "- **Last Check:** $(cat $TIMESTAMP_FILE)" >> $GITHUB_STEP_SUMMARY

  build-and-deploy:
    runs-on: self-hosted  # Changed to self-hosted for Cloudflare Access
    # 90, not 60: a full cache-miss rebuild runs generate (≤30m) + image
    # optimization (≤40m) back to back, which alone can exceed a 60m job
    # budget and get killed mid-image-pass. Incremental builds finish in a
    # fraction of this; the ceiling only bites on a cold first run.
    timeout-minutes: 90  # Prevent workflow from running indefinitely
    
    steps:
    - name: Validate required environment variables
      run: |
        echo "🔍 Validating required environment variables..."
        MISSING_VARS=()
        MISSING_OPTIONAL=()
        
        # Check for required secrets
        if [ -z "${{ secrets.WP_AUTH_TOKEN }}" ]; then
          MISSING_VARS+=("WP_AUTH_TOKEN")
        fi
        
        # Check for optional secrets (warn but don't fail)
        if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
          MISSING_OPTIONAL+=("SLACK_WEBHOOK_URL")
        fi
        
        if [ -z "${{ secrets.PLAUSIBLE_SHARE_LINK }}" ]; then
          MISSING_OPTIONAL+=("PLAUSIBLE_SHARE_LINK")
        fi
        
        # Report required variables
        if [ ${#MISSING_VARS[@]} -gt 0 ]; then
          echo "❌ Missing required environment variables:"
          for var in "${MISSING_VARS[@]}"; do
            echo "  - $var"
          done
          echo ""
          echo "📝 Please configure these secrets in repository settings:"
          echo "   Settings > Secrets and variables > Actions"
          exit 1
        else
          echo "✅ All required environment variables are set"
          echo "  ✓ WP_AUTH_TOKEN"
        fi
        
        # Report optional variables
        if [ ${#MISSING_OPTIONAL[@]} -gt 0 ]; then
          echo ""
          echo "⚠️  Optional environment variables not set (non-blocking):"
          for var in "${MISSING_OPTIONAL[@]}"; do
            echo "  - $var"
          done
        fi
    
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0  # Fetch full history for accurate git stats in changelog

    # The built site lives on the `site` branch, not on main: one parentless
    # commit holding public/, force-pushed by "Commit and push static site" and
    # deployed by Cloudflare Pages (production branch = site). Committing
    # public/ to main grew the repo to 2 GB of build-artefact history.
    #
    # Extract the currently-published site into public/ — incremental builds
    # seed static-output from it and reuse its AVIF/WebP. PREV_SITE_SHA is the
    # base the later steps diff against (changed-page KV purge, static-asset
    # purge) and the lease for the force-push.
    # The longer step bodies live in scripts/ci/. Copy them out of the
    # working tree now: "Prepare output for deployment" runs
    # `git reset --hard origin/main`, and if main moved during the build,
    # later steps would otherwise run scripts from a newer commit than this
    # workflow file — exactly what inline run: blocks could never do.
    - name: Snapshot CI step scripts
      run: rm -rf "$RUNNER_TEMP/ci" && cp -R scripts/ci "$RUNNER_TEMP/ci"

    - name: Restore published site from the site branch
      run: |
        rm -rf public/
        if git fetch --depth=1 origin +refs/heads/site:refs/remotes/origin/site; then
          PREV_SITE_SHA=$(git rev-parse refs/remotes/origin/site)
          git archive "$PREV_SITE_SHA" public | tar -x
          echo "✅ Restored public/ from site@${PREV_SITE_SHA:0:7} ($(find public -type f | wc -l | xargs) files)"
        else
          PREV_SITE_SHA=""
          echo "⚠️  No site branch yet — this run builds without a previous public/"
        fi
        echo "PREV_SITE_SHA=$PREV_SITE_SHA" >> "$GITHUB_ENV"

    # No Actions cache for .image_optimization_cache: it's git-tracked on main
    # (committed by the "Commit and push" step when it changes and restored on
    # checkout), so an actions/cache layer on top was pure redundancy — and its
    # hashFiles() key lagged a build behind, masking that fact. (The spell-check
    # timestamp is the spell-check job's own Actions cache.) The
    # incremental build cache below is different: .build-cache.json is gitignored,
    # so the Actions cache is the only thing that persists it between runs.

    - name: Restore incremental build cache
      id: incremental-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build-cache.json
        # Include run_attempt so re-runs of the same workflow (e.g. after a
        # validation failure + retry) don't try to reserve a cache key that
        # the failed attempt already owns. The restore-keys wildcard still
        # finds the most recent previous build, so incrementality survives.
        key: incremental-build-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          incremental-build-cache-

    # Raw (pre-transform) HTML + CSS as it looked immediately after the
    # generator ran, before any optimisation pass touched it.
    #
    # Incremental builds seed ./static-output from public/ (restored from the
    # site branch above) — which is the *published* output, i.e. HTML that optimize_css / html_transformer have
    # already rewritten. Re-running those passes over their own output is not
    # idempotent: the WP stylesheet inliner has already converted some
    # <link rel=stylesheet> into <style>, and extract_critical_css only
    # harvests rules from the <link>s that are still present, so the critical
    # CSS block comes out different every run. Measured on 2026-08-09: two
    # consecutive incremental runs with identical code and zero content
    # changes rewrote 250 of 255 pages, differing *only* in the critical-CSS
    # block, which is what made every deploy a ~1700-file commit.
    #
    # Restoring the raw snapshot over the seed means post-processing always
    # starts from the same input, so an unchanged page produces a
    # byte-identical output and drops out of the diff.
    - name: Restore raw pre-transform HTML snapshot
      id: raw-snapshot-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .raw-html-snapshot
        # run_attempt for the same reason as the build cache above.
        key: raw-html-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          raw-html-snapshot-

    - name: Check cache status
      run: |
        echo "🔍 Checking cache restoration status..."
        echo "Image cache source: git-tracked .image_optimization_cache (restored on checkout)"

        if [ -f ".image_optimization_cache/optimization_cache.json" ]; then
          ENTRIES=$(python3 -c "import json; print(len(json.load(open('.image_optimization_cache/optimization_cache.json'))))" 2>/dev/null || echo "0")
          echo "✓ Image cache: $ENTRIES entries"
        else
          echo "⚠️  Image cache not found (will be created on first run)"
        fi

        echo ""
        echo "Incremental build cache hit: ${{ steps.incremental-cache-restore.outputs.cache-hit }}"
        echo "Incremental cache matched key: ${{ steps.incremental-cache-restore.outputs.cache-matched-key }}"
        if [ -f ".build-cache.json" ]; then
          LAST_BUILD=$(python3 -c "import json; d=json.load(open('.build-cache.json')); print(d.get('last_build_time','unknown'))" 2>/dev/null || echo "unknown")
          POSTS=$(python3 -c "import json; d=json.load(open('.build-cache.json')); print(len(d.get('posts',{})))" 2>/dev/null || echo "0")
          echo "✓ Incremental build cache: $POSTS cached posts, last build: $LAST_BUILD"
          echo "⚡ This run will use incremental WordPress generation"
        else
          echo "⚠️  Incremental build cache not found — first run will be a full build"
        fi

        echo ""
        echo "Raw HTML snapshot matched key: ${{ steps.raw-snapshot-restore.outputs.cache-matched-key }}"
        if [ -d ".raw-html-snapshot" ]; then
          RAW_HTML=$(find .raw-html-snapshot -name '*.html' -type f | wc -l | xargs)
          echo "✓ Raw snapshot: $RAW_HTML HTML files — post-processing starts from pre-transform input"
        else
          echo "⚠️  Raw snapshot not found — this run seeds HTML from post-processed public/"
        fi

    - name: Install system dependencies
      run: |
        echo "📦 Checking system dependencies..."

        # Check for each required binary up front; only touch apt if something
        # is actually missing. On a long-lived self-hosted runner everything is
        # already installed, and hitting apt just to re-confirm costs a dpkg
        # lock wait (up to 120s) behind unattended-upgrades.
        MISSING_PKGS=()
        # No image CLIs (avifenc, cwebp, optipng, jpegoptim): every encode
        # goes through Pillow in optimize_images.py, and nothing calls them.
        command -v jq       >/dev/null 2>&1 || MISSING_PKGS+=(jq)
        command -v bc       >/dev/null 2>&1 || MISSING_PKGS+=(bc)
        python3 -m pip --version >/dev/null 2>&1 || MISSING_PKGS+=(python3-pip)
        python3 -c 'import venv' >/dev/null 2>&1 || MISSING_PKGS+=(python3-venv)

        if [ ${#MISSING_PKGS[@]} -eq 0 ]; then
          echo "✅ All system dependencies already installed — skipping apt"
        else
          echo "⚠️  Missing packages: ${MISSING_PKGS[*]}"
          echo "⏳ Waiting for dpkg lock..."
          sudo apt-get -o DPkg::Lock::Timeout=120 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y "${MISSING_PKGS[@]}"
          echo "✅ System dependencies installed"
        fi
        echo "  ✓ pip: $(python3 -m pip --version)"
        echo "  ✓ jq: $(jq --version)"
        echo "  ✓ bc: $(bc --version | head -n 1)"

    - name: Verify Python installation
      run: |
        echo "🐍 Verifying Python installation..."
        python3 --version
        which python3
        echo "✅ Python is available"
        
    - name: Install dependencies
      run: |
        echo "🔧 Ensuring Python dependencies are installed..."
        # The self-hosted runner's Python environment persists between runs, so a
        # full reinstall every build is wasted network + time. Reinstall only when
        # requirements change or a probe import is missing: stamp the requirements
        # hash in $HOME (survives the later `git reset --hard origin/main`, which a
        # repo-local stamp would not) and skip when it matches AND the key packages
        # import cleanly. Mirrors the "check before touching apt" gate above.
        DEPS_SIG="$(sha256sum requirements.txt | awk '{print $1}')"
        STAMP="$HOME/.jkcoukblog_deps_stamp"
        if [ "$(cat "$STAMP" 2>/dev/null)" = "$DEPS_SIG" ] \
           && python3 -c "import requests, bs4; from PIL import features; assert features.check('avif')" 2>/dev/null; then
          echo "✅ Dependencies already satisfied (requirements unchanged) — skipping pip install"
        else
          echo "📦 Installing/updating Python dependencies..."
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install -r requirements.txt --break-system-packages
          # AVIF comes from Pillow itself (>= 11.2 wheels); pillow-avif-plugin
          # is no longer installed. Fail here, not mid-build, if this Pillow
          # can't encode it.
          python3 -c "from PIL import features; assert features.check('avif'), 'Pillow has no AVIF support'"
          echo "$DEPS_SIG" > "$STAMP"
          echo "✅ Dependencies installed"
        fi
        echo "📋 Installed packages:"
        python3 -m pip list | grep -E "(requests|beautifulsoup4|Pillow)"
        
    - name: Test runner environment
      if: github.event_name == 'workflow_dispatch'  # Only on manual runs
      run: |
        echo "🔍 Current working directory: $(pwd)"
        echo "📋 Files in current directory:"
        ls -la
        echo "📄 Looking for key files:"
        ls -la scripts/wp_to_static_generator.py || echo "❌ File not found"
        echo "🐍 Python version and path:"
        python3 --version
        which python3
        echo "📦 Checking Python dependencies:"
        python3 -c "import requests; print(f'✅ requests {requests.__version__}')" || echo "❌ requests not found"
        python3 -c "import bs4; print(f'✅ beautifulsoup4 {bs4.__version__}')" || echo "❌ beautifulsoup4 not found"

    - name: Validate CSP configuration (Utterances, Plausible, Credly)
      run: |
        echo "🔒 Validating CSP allows all third-party services..."
        echo "   (runs early — only reads the repo-root _headers file, no WP access needed)"
        python3 scripts/test_csp.py || {
          echo ""
          echo "❌ CSP validation failed!"
          echo "   Check the Content-Security-Policy line in _headers (root)"
          echo ""
          exit 1
        }

    - name: Validate _redirects stays under Cloudflare Pages free-plan limit
      # Cloudflare Pages free plan silently drops any static redirect past
      # rule #100 — everything alphabetically after ~/octopus becomes a 404.
      # We hit this once (150+ rules, half broken, invisible in GSC until we
      # dug in). Flat-slug legacy redirects were moved into _worker.template.js
      # in the commit that added this guard; keep _redirects small enough to
      # stay safely within the limit forever.
      run: |
        if [ ! -f public/_redirects ]; then
          echo "ℹ️  public/_redirects not present (fine — worker handles everything)"
        else
          RULES=$(grep -cvE '^\s*(#|$)' public/_redirects || true)
          echo "public/_redirects contains $RULES active rule(s)"
          if [ "$RULES" -gt 90 ]; then
            echo ""
            echo "❌ public/_redirects has $RULES active rules — Cloudflare Pages"
            echo "   free plan caps at 100; rules past the limit are silently"
            echo "   dropped and produce GSC 404s. Move legacy/bulk redirects"
            echo "   into _worker.template.js using PATH_MANIFEST."
            echo ""
            exit 1
          fi
        fi

    - name: Validate WordPress Source Health
      env:
        WP_AUTH_TOKEN: ${{ secrets.WP_AUTH_TOKEN }}
      run: |
        echo "🔍 Validating WordPress source before generation..."
        echo ""

        # Run WordPress source validator
        python3 scripts/validate_wordpress_source.py

        # Check exit code
        if [ $? -ne 0 ]; then
          echo ""
          echo "❌ WordPress source validation failed"
          echo "📋 See wordpress-source-validation.json for details"
          echo ""
          echo "Fix the issues in WordPress before deploying:"
          echo "  - Check broken media references"
          echo "  - Fix missing categories/tags"
          echo "  - Verify SEO metadata (titles, descriptions)"
          exit 1
        fi

        echo ""
        echo "✅ WordPress source is healthy - proceeding with generation"

    - name: Upload WordPress validation report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: wordpress-validation-report
        path: wordpress-source-validation.json

    - name: Generate static site
      timeout-minutes: 30  # Timeout for site generation
      env:
        WP_AUTH_TOKEN: ${{ secrets.WP_AUTH_TOKEN }}
      run: bash "$RUNNER_TEMP/ci/generate_site.sh"

    - name: Save incremental build cache
      if: success()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build-cache.json
        # Must match the restore key above — include run_attempt so re-runs
        # don't fail with "Unable to reserve cache with key ... — another
        # job may be creating this cache" against their own prior attempt.
        key: incremental-build-cache-${{ github.run_id }}-${{ github.run_attempt }}

    # Saved here rather than at the end of the job: static-output is moved to
    # public/ in "Prepare output for deployment", and by then every file in it
    # has been through the optimisation passes. The snapshot is only useful as
    # the pre-transform state, so it has to be persisted straight after
    # generation. Saving it before the build has fully passed is deliberate —
    # it is an input snapshot, not a record of a good deploy, and a failed run
    # still generated valid raw HTML.
    - name: Save raw pre-transform HTML snapshot
      if: success()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .raw-html-snapshot
        key: raw-html-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Export to Markdown
      run: |
        echo "📝 Exporting content to markdown..."
        python3 scripts/markdown_exporter.py \
          ./static-output \
          ./static-output/markdown \
          https://jameskilby.co.uk
        
    - name: Generate Markdown API
      run: |
        echo "🔌 Generating markdown API..."
        python3 scripts/markdown_api.py \
          ./static-output/markdown \
          ./static-output/api

    - name: Generate llms.txt
      run: |
        echo "📝 Generating llms.txt + llms-full.txt for AI ingestion..."
        python3 scripts/generate_llms_txt.py \
          ./static-output/markdown \
          ./static-output \
          --with-full

    - name: Content quality validation
      id: content_validation
      timeout-minutes: 5
      continue-on-error: true  # Non-blocking: warnings won't fail the build
      run: |
        echo "📋 Running content quality checks..."

        # Run content validator against the freshly-built output (not the previously published public/)
        python3 scripts/content_validator.py static-output || {
          echo "⚠️  Content validation found issues (non-blocking)"
        }
        
        # Parse validation report and add to summary
        if [ -f "validation-report.json" ]; then
          ERROR_COUNT=$(jq '.summary.errors' validation-report.json)
          WARNING_COUNT=$(jq '.summary.warnings' validation-report.json)
          STATUS=$(jq -r '.summary.status' validation-report.json)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Content Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $([ "$STATUS" = "PASS" ] && echo "✅ Pass" || echo "⚠️ Issues Found")" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show top issues if any
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "### ❌ Top Errors" >> $GITHUB_STEP_SUMMARY
            jq -r '.errors[:3] | .[] | "- " + .message' validation-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "### ⚠️ Top Warnings" >> $GITHUB_STEP_SUMMARY
            jq -r '.warnings[:3] | .[] | "- " + .message' validation-report.json >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️  No validation report generated" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload content validation report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: content-validation-report
        path: validation-report.json

    - name: Optimize images
      timeout-minutes: 40  # Timeout for image optimization
      env:
        REENCODE_IMAGES: ${{ github.event.inputs.reencode_images }}
      run: bash "$RUNNER_TEMP/ci/optimize_images.sh"

    - name: Optimize CSS files (unused removal + minify)
      id: optimize_css
      run: |
        echo "🎨 Optimizing CSS files..."

        # Remove unused CSS selectors (must complete before HTML transformer
        # extracts critical CSS from the pruned stylesheets)
        echo "  1/2 Removing unused CSS selectors..."
        python3 scripts/optimize_css.py ./static-output || echo "⚠️  CSS optimization failed (non-blocking)"

        # Minify CSS files
        echo "  2/2 Minifying CSS files..."
        python3 scripts/optimize_css.py ./static-output --minify-only || echo "⚠️  CSS minification failed (non-blocking)"
      continue-on-error: true

    - name: Single-pass HTML transformer (SEO + pictures + perf + critical CSS + minify)
      id: html_transformer
      timeout-minutes: 15
      run: |
        echo "🔄 Running single-pass HTML transformer..."
        echo "   Applies in one parse cycle per file:"
        echo "     1. SEO fixes (title, meta, canonical, JSON-LD)"
        echo "     2. Image → picture conversion (AVIF/WebP sources)"
        echo "     3. Performance hints (async/defer, lazy loading, preconnect)"
        echo "     4. Critical CSS extraction and inlining"
        echo "     5. Head link deduplication"
        echo "     6. HTML minification"
        echo ""

        python3 scripts/html_transformer.py ./static-output || {
          echo "⚠️  HTML transformer failed (non-blocking)"
          exit 0
        }
      continue-on-error: true

    - name: Internal links for orphan posts (post-transform + verify)
      id: internal_links
      run: |
        # Runs AFTER the transformer, over the final output, so the links can't
        # be dropped by the incremental-skip / raw-snapshot / transform
        # interactions that reverted the earlier in-generator pass. The script
        # verifies against the bytes on disk and exits non-zero (loud) if any
        # orphan post is still missing an inbound link — surfaced here but
        # non-blocking so an SEO-nicety never sinks a deploy.
        python3 scripts/internal_links.py ./static-output || {
          echo "::warning::internal-linking guard failed — some orphan posts have no inbound link on disk"
          exit 0
        }
      continue-on-error: true

    - name: Copy standalone pages (self-contained tools)
      id: standalone_pages
      # Self-contained static apps (e.g. the VMC analyzer at /vmc-analyzer/)
      # must bypass the HTML pipeline — html_transformer.py and the
      # internal-link / search / widget passes assume a WordPress-shaped page
      # and would rewrite or break them. So copy them in AFTER every HTML
      # transform above, but BEFORE the soft-404 step below: that step builds
      # path-manifest.json (rglob of *.html) which the Advanced Mode Worker
      # uses to tell a real content URL from a soft-404. A standalone page
      # copied in after the manifest is stamped would be served as a 404.
      run: |
        echo "📄 Copying standalone pages..."
        python3 scripts/copy_standalone_pages.py ./static-output || echo "⚠️  Standalone copy failed (non-blocking)"
      continue-on-error: true

    - name: Generate soft-404 artefacts and stamp Advanced Mode Worker
      run: |
        # Must run BEFORE Brotli compression so _worker.js and
        # path-manifest.json get compressed + validated in lockstep with
        # their .br/.gz sidecars. Running this AFTER the mv to public/
        # lets stale committed .br files get reused, producing a mismatch
        # at the validation step.
        echo "🛡️  Generating soft-404 artefacts into static-output..."
        python3 scripts/generate_soft404_artefacts.py ./static-output

        if [ -f "_worker.template.js" ]; then
          python3 scripts/stamp_worker_manifest.py ./static-output
          echo "✅ _worker.js stamped with path manifest"
        else
          echo "⚠️  WARNING: _worker.template.js not found — Advanced Mode will not be enabled"
        fi

    - name: Generate per-post Open Graph images
      id: og_images
      # Replace the shared fallback og:image with a branded, title-specific
      # PNG so social shares of different posts look different. 60% of posts
      # currently ship the same generic image. Must run BEFORE Brotli so
      # the rewritten HTML meta tags get compressed in lockstep.
      run: |
        echo "🖼️  Generating per-post og:images for fallback pages..."
        python3 scripts/generate_og_images.py ./static-output \
          || echo "⚠️  og:image generation failed (non-blocking)"
      continue-on-error: true

    - name: Subset Anton font to chars used in headings
      id: font_subset
      # Anton ships at ~130 KB and is preloaded (LCP critical path), but
      # only ~90 of its glyphs are actually used across the site. Subset
      # to ~12 KB. Must run BEFORE Brotli so the .br/.gz sidecars get
      # regenerated against the smaller font in the next compress step.
      # Subsetting is idempotent — re-running against an already-subsetted
      # file is a near-no-op.
      run: |
        echo "🔤 Subsetting Anton font to used characters..."
        python3 scripts/subset_fonts.py ./static-output \
          || echo "⚠️  Font subsetting failed (non-blocking)"
      continue-on-error: true

    - name: Rewrite stale vendored-CDN URLs in cached HTML
      # The WP→static generator is incremental — posts whose source hasn't
      # changed reuse cached HTML and skip script-tag injection. This sweep
      # rewrites any straggler third-party URLs (Splide, Fuse) to the
      # vendored /js/* paths so the runner self-heals on every build.
      run: python3 scripts/rewrite_vendored_urls.py ./static-output

    - name: Minify JavaScript
      id: minify_js
      # WP-Optimize's minify feature (disabled — its cache path embedded a
      # timestamp that rewrote every page on each WordPress-side rebuild) was
      # the only thing minifying JS. optimize_css.py covers CSS; minify_html.py
      # deliberately stashes <script> bodies. This closes that gap.
      #
      # Must run BEFORE the Brotli step so the .br/.gz sidecars are built from
      # the minified bytes. _worker.js is excluded by the script itself.
      run: |
        echo "📜 Minifying JavaScript..."
        python3 scripts/minify_js.py ./static-output || echo "⚠️  JS minification failed (non-blocking)"
      continue-on-error: true

    - name: Brotli + Gzip compress static files
      id: compress
      timeout-minutes: 10
      run: bash "$RUNNER_TEMP/ci/compress.sh"
      continue-on-error: true

    - name: Interactive UI smoke tests (Playwright)
      id: smoke_tests
      # Headless-Chromium walkthrough that exercises the JS-driven UI
      # (mobile drawer, Splide carousel layout, sticky-header behaviour
      # when configured). Specifically guards against the optimize_css
      # change in #36 stealthily stripping rules for classes added by
      # JavaScript at runtime — those don't appear in the served HTML so
      # static "is this selector used?" analysis can't see them.
      #
      # continue-on-error so a broken browser setup never blocks a deploy.
      # It must not pass silently either: this step went green on every run
      # while skipping every test (Playwright refused to download Chromium
      # for Ubuntu 26.04). Any setup failure now fails the step, which
      # "Report non-blocking step failures" lists and Slack shows as a
      # warning — the deploy itself still goes out.
      timeout-minutes: 5
      run: |
        # Playwright is pinned in requirements-ui.txt (Dependabot bumps it)
        # and reinstalled whenever the runner's copy differs. Installing
        # only when missing left the runner on an old release that predates
        # its OS. --break-system-packages: the runner uses the system Python
        # (PEP 668).
        WANT=$(sed -n 's/^playwright==//p' requirements-ui.txt)
        HAVE=$(python3 -c "import importlib.metadata as m; print(m.version('playwright'))" 2>/dev/null || true)
        if [ "$HAVE" != "$WANT" ]; then
          echo "📦 Installing Playwright $WANT (runner has: ${HAVE:-none})..."
          python3 -m pip install --break-system-packages -r requirements-ui.txt
        fi

        # Idempotent, and a fast no-op when this release's browser build is
        # already present. --only-shell: headless launches use the
        # chrome-headless-shell build, so the full Chromium isn't needed.
        # No --with-deps: that runs `sudo apt install`, and sudo needs a
        # password on the runner.
        if ! python3 -m playwright install --only-shell chromium; then
          echo "::error title=Playwright browser install failed::playwright install refused or failed on this runner (see log). Bump playwright in requirements-ui.txt if the OS is unsupported."
          exit 1
        fi

        # The browser's shared libraries come from apt, which this step
        # can't run. Name anything missing so the one-off fix is obvious.
        SHELL_BIN=$(find "$HOME/.cache/ms-playwright" -path '*chromium_headless_shell-*' -name chrome-headless-shell -type f 2>/dev/null | sort -V | tail -1)
        MISSING_LIBS=$( [ -n "$SHELL_BIN" ] && ldd "$SHELL_BIN" 2>/dev/null | awk '/not found/ {print $1}' | sort -u | tr '\n' ' ')
        if [ -n "$MISSING_LIBS" ]; then
          # Not `sudo python3 -m playwright install-deps`: Playwright is a
          # per-user install (~/.local), which root's Python can't import.
          echo "::error title=Chromium system libraries missing::$MISSING_LIBS— install the apt packages that provide them on the runner (Ubuntu 26.04: libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2); see docs/TESTING.md"
          exit 1
        fi

        # --require-browser: a run that can't launch Chromium exits non-zero
        # instead of skipping with 0.
        python3 scripts/test_interactive_ui.py ./static-output --require-browser
      continue-on-error: true

    - name: Validate HTML and deployment (parallel)
      id: validation
      timeout-minutes: 10
      run: |
        echo "🔍 Running HTML validation and deployment validation in parallel..."

        # All three validators are read-only — safe to run simultaneously.
        python3 scripts/validate_html.py ./static-output &
        PID_HTML=$!
        python3 scripts/validate_deployment.py ./static-output &
        PID_DEPLOY=$!
        # --baseline-sitemap: public/sitemap.xml (restored from the site branch) is the last
        # deployed one; fail if this build silently dropped >10% of its URLs.
        python3 scripts/validate_seo.py ./static-output --baseline-sitemap ./public/sitemap.xml &
        PID_SEO=$!

        HTML_OK=true
        DEPLOY_OK=true
        SEO_OK=true

        wait $PID_HTML   || HTML_OK=false
        wait $PID_DEPLOY || DEPLOY_OK=false
        wait $PID_SEO    || SEO_OK=false

        if [ "$HTML_OK" = true ]; then
          echo "✅ HTML validation passed!"
        else
          echo "❌ HTML validation failed!"
        fi

        if [ "$DEPLOY_OK" = true ]; then
          echo "✅ Deployment validation passed!"
        else
          echo "❌ Deployment validation failed!"
        fi

        if [ "$SEO_OK" = true ]; then
          echo "✅ SEO validation passed!"
        else
          echo "❌ SEO validation failed!"
        fi

        # Add to GitHub Actions summary
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ✅ Validation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **HTML Validation:** $([ "$HTML_OK" = true ] && echo '✅ Passed' || echo '❌ Failed')" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Validation:** $([ "$DEPLOY_OK" = true ] && echo '✅ Passed' || echo '❌ Failed')" >> $GITHUB_STEP_SUMMARY
        echo "- **SEO Validation:** $([ "$SEO_OK" = true ] && echo '✅ Passed' || echo '❌ Failed')" >> $GITHUB_STEP_SUMMARY

        # Fail step if any validation failed
        if [ "$HTML_OK" = false ] || [ "$DEPLOY_OK" = false ] || [ "$SEO_OK" = false ]; then
          exit 1
        fi

    - name: SEO drift check (non-blocking)
      # Diffs policy-driven SEO signals (canonical, schema types, robots, WP
      # host leak, title policy, OG tags) against the committed baseline so a
      # silent pipeline regression on this auto-deploy surfaces in the log.
      # Non-blocking by design — re-baseline with `make drift-snapshot` when a
      # change deliberately alters these signals.
      continue-on-error: true
      run: |
        echo "## 🔎 SEO drift" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        python3 scripts/drift_baseline.py --check ./static-output | tee -a $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Prepare output for deployment
      run: bash "$RUNNER_TEMP/ci/prepare_output.sh"

    - name: Generate changelog, stats, and recompress
      id: changelog_stats
      run: |
        echo "📋 Generating changelog page..."
        python3 scripts/generate_changelog.py || echo "⚠️  Changelog generation failed (non-blocking)"

        echo "📊 Generating stats page..."
        PLAUSIBLE_SHARE_LINK="${{ secrets.PLAUSIBLE_SHARE_LINK }}" python3 scripts/generate_stats_page.py || echo "⚠️  Stats page generation failed (non-blocking)"

        # Compress the WHOLE tree, not just changelog/stats. This is the ONLY
        # pass that compresses HTML: the main Brotli pass ran on static-output
        # with --skip-html because convert_to_staging.py rewrites HTML
        # (absolute → relative URLs) during "Prepare output for deployment",
        # which would invalidate any HTML sidecars built earlier. Non-HTML
        # files keep their pass-1 sidecars — brotli_compress.py skips any file
        # whose .br is already newer than its source (mtime check) — and this
        # pass also covers the just-generated changelog/stats pages and
        # security.txt. If this step fails, HTML ships without sidecars and
        # Cloudflare compresses on the fly (slower, but never mismatched).
        echo "🗜️  Compressing HTML + files changed after the main Brotli pass (URL rewrite, changelog, stats)..."
        python3 scripts/brotli_compress.py public/ || echo "⚠️  Recompression failed (non-blocking)"
      continue-on-error: true

    - name: Commit and push static site
      id: commit_push
      timeout-minutes: 5
      run: bash "$RUNNER_TEMP/ci/publish_site.sh"
    - name: Notify on success
      if: success()
      run: |
        echo "✅ Static site generated and committed successfully!"
        echo "🌐 Cloudflare Pages will auto-deploy from the 'public' directory"
        echo "📁 Generated files are now in the 'public' directory for Pages deployment"

    - name: Setup Node.js (for Wrangler)
      if: success()
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
      with:
        node-version: '20'

    - name: Upload search index to Workers KV
      id: search_index
      if: success()
      run: |
        echo "🔍 Uploading search index to Workers KV..."
        
        # Check if search index exists
        if [ ! -f "public/search-index.json" ]; then
          echo "⚠️  Search index not found, skipping KV upload"
          exit 0
        fi
        
        # Install Wrangler if not already available
        if ! command -v wrangler &> /dev/null; then
          echo "Installing Wrangler..."
          npm install -g wrangler
        fi
        
        # Upload to KV (requires CLOUDFLARE_API_TOKEN and KV_SEARCH_INDEX_ID secrets)
        if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.KV_SEARCH_INDEX_ID }}" ]; then
          CURRENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          if npx wrangler kv key put \
            --namespace-id="${{ secrets.KV_SEARCH_INDEX_ID }}" \
            "current" public/search-index.json \
            --metadata="{\"updated\":\"${CURRENT_TIME}\"}"; then
            echo "✅ Search index uploaded to Workers KV"
            echo "   Updated: ${CURRENT_TIME}"

            # Add to summary
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🔍 Search Index Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **KV Namespace:** SEARCH_INDEX" >> $GITHUB_STEP_SUMMARY
            echo "- **Updated:** ${CURRENT_TIME}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Failed to upload search index to KV (non-blocking)"
          fi
        else
          echo "ℹ️  Skipping KV upload (CLOUDFLARE_API_TOKEN or KV_SEARCH_INDEX_ID not set)"
          echo "   To enable: Add secrets to repository settings"
        fi
      continue-on-error: true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    
    # Soft-404 KV cleanup step removed — the worker's isKnownContentPath
    # guard (see _worker.template.js) prevents new ghost entries at write
    # time (it runs BEFORE the KV lookup, so even a stale ghost entry is
    # never served). scripts/purge_soft404_kv_cache.py is kept in the repo
    # for emergency ad-hoc use.

    - name: Purge changed HTML from KV cache
      id: kv_purge
      if: success()
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # IMPORTANT: not $GITHUB_SHA. github.sha is the commit that *triggered*
        # the workflow; the deploy job itself pushes a new commit later, and
        # Cloudflare Pages deploys *that* one. The Commit-and-push step exports
        # its post-push HEAD via this output so we wait for the right deploy.
        # When no commit was needed (no content changed), PUSHED_SHA is empty
        # and we skip the wait entirely — the existing deployment is still live.
        PUSHED_SHA: ${{ steps.commit_push.outputs.pushed_sha }}
        CACHE_PURGE_TOKEN: ${{ secrets.CACHE_PURGE_TOKEN }}
      run: bash "$RUNNER_TEMP/ci/kv_purge.sh"
      continue-on-error: true

    # Cloudflare zone HTTP cache purge for HTML removed — verified via live
    # response headers that worker HTML responses are always
    # `cf-cache-status: DYNAMIC`, so the Pages Advanced Mode worker bypasses
    # Cloudflare's edge HTTP cache entirely for HTML. There is nothing at
    # the zone HTTP cache layer to invalidate. The "Purge all HTML from KV
    # cache" step above is the actual cache invalidation for HTML.

    - name: Purge static assets from Cloudflare cache
      id: static_purge
      if: success()
      env:
        CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        FORCE_PURGE: ${{ github.event.inputs.force_static_purge }}
        PUSHED_SHA: ${{ steps.commit_push.outputs.pushed_sha }}
      run: |
        # Only fire when one of the files purge_static_cache.sh actually
        # purges changed in this deploy. Keep this pattern in sync with the
        # URL list in scripts/purge_static_cache.sh.
        #
        # Fonts: subset_fonts.py rewrites them in-place on every build with
        # the glyph set this build's HTML needs. The _headers rule on
        # /assets/fonts/* says max-age=31536000 immutable, so without an
        # explicit purge the CF edge serves the previous build's font forever.
        STATIC_ASSET_PATTERN='^public/((favicon\.ico|favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon\.png|site\.webmanifest)|assets/fonts/.*\.woff2)$'

        if [ "$FORCE_PURGE" = "true" ]; then
          # Manual dispatch override — see the workflow_dispatch input.
          CHANGED="force-static-purge=true"
        elif [ -z "$PUSHED_SHA" ]; then
          # Nothing was published this run, so nothing changed.
          CHANGED=""
        elif [ -n "$PREV_SITE_SHA" ]; then
          CHANGED=$(git diff --name-only "$PREV_SITE_SHA" "$PUSHED_SHA" | grep -E "$STATIC_ASSET_PATTERN" || true)
        else
          # First site-branch deploy — no previous deploy to diff against.
          # Run the purge once to be safe.
          CHANGED="initial-deploy"
        fi

        if [ -z "$CHANGED" ]; then
          echo "ℹ️  No favicon / webmanifest / font files changed — skipping static asset purge"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🗑️ Static Asset Purge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Skipped (no matching files changed)" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        echo "Changed static assets:"
        echo "$CHANGED"
        bash scripts/purge_static_cache.sh
      continue-on-error: true

    - name: Submit URLs to IndexNow
      id: indexnow
      if: success()
      run: |
        echo "🔔 Submitting URLs to IndexNow..."

        # The key file must be live on jameskilby.co.uk before we submit.
        # Verify it's accessible with up to 12 retries (120s) before submitting.
        # This is an independent guard — it doesn't rely on the KV purge step
        # having waited (that step exits early when CACHE_PURGE_TOKEN isn't set).
        INDEXNOW_KEY=$(cat .indexnow_key 2>/dev/null || true)
        if [ -n "$INDEXNOW_KEY" ]; then
          KEY_URL="https://jameskilby.co.uk/${INDEXNOW_KEY}.txt"
          echo "🔑 Verifying key file is live: $KEY_URL"
          MAX_ATTEMPTS=12
          ATTEMPT=0
          KEY_LIVE=false
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$KEY_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Key file accessible (HTTP 200) — proceeding with submission"
              KEY_LIVE=true
              break
            fi
            echo "   Key file returned HTTP $HTTP_CODE (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS) — waiting 10s..."
            ATTEMPT=$((ATTEMPT+1))
            sleep 10
          done
          if [ "$KEY_LIVE" = "false" ]; then
            echo "⚠️  Key file not accessible after ${MAX_ATTEMPTS} attempts — skipping IndexNow submission"
            exit 0
          fi
        else
          echo "ℹ️  No .indexnow_key found — skipping key verification"
        fi

        python3 scripts/submit_indexnow.py ./public || echo "⚠️  IndexNow submission failed (non-blocking)"
      continue-on-error: true

    # The "Ping Google sitemap on new post" step was removed: Google shut down
    # the sitemap ping endpoint (https://www.google.com/ping?sitemap=) in
    # January 2024 — it now returns HTTP 404 and does nothing. Google discovers
    # the sitemap via robots.txt + Search Console instead. IndexNow (above)
    # already covers fast push-notification of new URLs to Bing/Yandex.

    - name: Report non-blocking step failures
      id: nonblocking_report
      if: always()
      run: |
        # The steps below are continue-on-error so a degraded build still
        # deploys, but their failures must not be invisible: collect every
        # outcome, write a summary, and feed the Slack notification.
        FAILED=()
        check() {
          if [ "$2" = "failure" ]; then FAILED+=("$1"); fi
        }
        check "Content quality validation"  "${{ steps.content_validation.outcome }}"
        check "CSS optimization"            "${{ steps.optimize_css.outcome }}"
        check "HTML transformer"            "${{ steps.html_transformer.outcome }}"
        check "OG image generation"         "${{ steps.og_images.outcome }}"
        check "Font subsetting"             "${{ steps.font_subset.outcome }}"
        check "Brotli/Gzip compression"     "${{ steps.compress.outcome }}"
        check "Playwright smoke tests"      "${{ steps.smoke_tests.outcome }}"
        check "Changelog/stats generation"  "${{ steps.changelog_stats.outcome }}"
        check "Search index KV upload"      "${{ steps.search_index.outcome }}"
        check "KV HTML cache purge"         "${{ steps.kv_purge.outcome }}"
        check "Static asset cache purge"    "${{ steps.static_purge.outcome }}"
        check "IndexNow submission"         "${{ steps.indexnow.outcome }}"

        COUNT=${#FAILED[@]}
        echo "failed_count=$COUNT" >> "$GITHUB_OUTPUT"
        if [ "$COUNT" -eq 0 ]; then
          echo "failed_list=" >> "$GITHUB_OUTPUT"
          echo "✅ All non-blocking steps succeeded"
        else
          LIST=$(printf '%s, ' "${FAILED[@]}"); LIST=${LIST%, }
          echo "failed_list=$LIST" >> "$GITHUB_OUTPUT"
          {
            echo "## ⚠️ Non-blocking steps failed ($COUNT)"
            echo ""
            for s in "${FAILED[@]}"; do echo "- $s"; done
            echo ""
            echo "The deploy proceeded anyway (these steps are continue-on-error), but the failures need a look."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ $COUNT non-blocking step(s) failed: $LIST"
        fi

    - name: Trigger Lighthouse quality checks
      # quality-checks.yml declares `push: paths: public/**`, but that trigger
      # has never once fired: pushes made with the default GITHUB_TOKEN don't
      # start other workflows (GitHub's loop prevention). Every run for the
      # last six days came from its 03:00 schedule, so a regression shipped at
      # 21:07 wasn't measured until the next morning — which is exactly how the
      # 2026-08-08 CLS regression (0.63, perf 60) went unreported until someone
      # ran PageSpeed by hand.
      #
      # Dispatching explicitly closes that loop: scores land in Slack minutes
      # after the deploy instead of up to 24 hours later. Non-blocking — the
      # site is already published by this point.
      if: success() && steps.commit_push.outputs.pushed_sha != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "🔦 Dispatching quality-checks.yml against production..."
        # run_lighthouse must be passed explicitly — the lighthouse job gates on
        # `inputs.run_lighthouse == 'true'` for workflow_dispatch events.
        gh workflow run quality-checks.yml --ref main \
          -f run_lighthouse=true -f run_formatting=true \
          && echo "✅ Lighthouse run queued" \
          || echo "⚠️  Could not queue Lighthouse run (non-blocking)"

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "channel": "#web",
            "username": "GitHub Actions",
            "icon_emoji": ":github:",
            "attachments": [
              {
                "color": "${{ (steps.nonblocking_report.outputs.failed_count == '0' && steps.validation.outputs.pages_over_budget == '0' && steps.validation.outputs.pages_stale == '0' && steps.html_transformer.outputs.css_skip_missing == '0') && 'good' || 'warning' }}",
                "title": "${{ (steps.nonblocking_report.outputs.failed_count == '0' && steps.validation.outputs.pages_over_budget == '0' && steps.validation.outputs.pages_stale == '0' && steps.html_transformer.outputs.css_skip_missing == '0') && '✅ jkcoukblog Build Success' || '⚠️ jkcoukblog Build Success (with warnings)' }}",
                "text": "jkcoukblog static site built and pushed successfully!",
                "fields": [
                  {
                    "title": "Non-blocking step failures",
                    "value": "${{ steps.nonblocking_report.outputs.failed_count == '0' && 'None' || steps.nonblocking_report.outputs.failed_list }}",
                    "short": false
                  },
                  {
                    "title": "Output budgets",
                    "value": "Max stylesheets/page: ${{ steps.validation.outputs.max_stylesheets || 'n/a' }} · over budget: ${{ steps.validation.outputs.pages_over_budget || '?' }} · stale pages: ${{ steps.validation.outputs.pages_stale || '?' }}",
                    "short": false
                  },
                  {
                    "title": "CSS inlining",
                    "value": "${{ steps.html_transformer.outputs.css_inlined || '?' }} inlined (${{ steps.html_transformer.outputs.css_inlined_kb || '?' }} KB) · ${{ steps.html_transformer.outputs.css_dropped_empty || '0' }} empty dropped · ${{ steps.html_transformer.outputs.css_skip_missing || '0' }} skipped-missing",
                    "short": false
                  },
                  {
                    "title": "Diff",
                    "value": "${{ steps.commit_push.outputs.diff_files || '0' }} files — ${{ steps.commit_push.outputs.diff_stat || 'no changes' }}",
                    "short": false
                  },
                  {
                    "title": "HTML Pages",
                    "value": "${{ env.HTML_COUNT }}",
                    "short": true
                  },
                  {
                    "title": "Site Size",
                    "value": "${{ env.TOTAL_SIZE }}",
                    "short": true
                  },
                  {
                    "title": "Images Optimized",
                    "value": "${{ env.OPTIMIZED_COUNT }} (skipped: ${{ env.SKIPPED_COUNT }})",
                    "short": true
                  },
                  {
                    "title": "Space Saved",
                    "value": "${{ env.SAVED_MB }}MB",
                    "short": true
                  },
                  {
                    "title": "Trigger",
                    "value": "${{ github.event_name == 'workflow_dispatch' && format('Manual by {0}', github.actor) || format('Commit by {0}', github.event.head_commit.author.name || github.actor) }}",
                    "short": true
                  },
                  {
                    "title": "Message",
                    "value": "${{ github.event.head_commit.message || 'Manual workflow dispatch' }}",
                    "short": false
                  }
                ],
                "footer": "🌐 Cloudflare Pages will now deploy the site automatically",
                "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                "actions": [
                  {
                    "type": "button",
                    "text": "View Workflow",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
        
    - name: Clean up on failure
      if: failure()
      run: |
        # Remove the partially-built static-output directory so stale files
        # from a failed run don't bleed into the next build.
        if [ -d "./static-output" ]; then
          rm -rf ./static-output
          echo "🧹 Removed ./static-output after failed build"
        fi

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Static site generation or commit failed!"
        
    - name: Notify Slack on Failure  
      if: failure()
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "channel": "#web",
            "username": "GitHub Actions",
            "icon_emoji": ":github:",
            "attachments": [
              {
                "color": "danger",
                "title": "❌ jkcoukblog Build Failed",
                "text": "jkcoukblog deployment failed!",
                "fields": [
                  {
                    "title": "Trigger",
                    "value": "${{ github.event_name == 'workflow_dispatch' && format('Manual by {0}', github.actor) || format('Commit by {0}', github.event.head_commit.author.name || github.actor) }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref_name }}",
                    "short": true
                  },
                  {
                    "title": "Message",
                    "value": "${{ github.event.head_commit.message || 'Manual workflow dispatch' }}",
                    "short": false
                  }
                ],
                "footer": "Please check the GitHub Actions logs for details",
                "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                "actions": [
                  {
                    "type": "button",
                    "text": "View Workflow Logs",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
