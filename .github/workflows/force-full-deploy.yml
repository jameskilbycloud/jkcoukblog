name: Force Full Deploy (no cache)

# Purges the two GH Actions caches that drive incremental behavior in
# deploy-static-site.yml, then triggers the regular deploy. The next run
# starts from a clean slate:
#
#   - incremental-build-cache-*  →  no .build-cache.json restored,
#                                   so wp_to_static_generator.py treats it as
#                                   a first build: fetches every WordPress
#                                   post, regenerates every archive page
#                                   (including / and /page/N/), and
#                                   reapplies every process_html() pass
#                                   (e.g. inject_homepage_redesign).
#   - build-cache-avif-v3-*      →  no .image_optimization_cache restored,
#                                   so optimize_images.py rebuilds every
#                                   AVIF/WebP from the original source.
#   - raw-html-snapshot-*        →  no pre-transform HTML/CSS overlaid on the
#                                   seed. Without the build cache the deploy
#                                   doesn't seed at all, so this is belt-and-
#                                   braces — but leaving a snapshot from a
#                                   superseded template behind is exactly the
#                                   kind of stale state this workflow exists
#                                   to clear.
#
# Use this when a script change touches code that only runs on pages the
# incremental builder would otherwise skip (typically the homepage / archive
# templates / image pipeline). After the run finishes, the next normal deploy
# repopulates both caches and incremental behavior resumes.

on:
  workflow_dispatch:
  # Weekly full rebuild — Sundays 03:00 UTC.
  #
  # Incremental builds skip unchanged back-catalogue posts, so any SEO/schema
  # logic that only runs in the generator stage (FAQ / BlogPosting / breadcrumb
  # / site-schema injection) never reaches a post until it's next edited in
  # WordPress. A weekly cache-busting rebuild backfills the whole catalogue so
  # newly-shipped schema features land site-wide without waiting for every post
  # to be touched. Off-peak to avoid contending with normal content deploys on
  # the self-hosted runner. Scheduled runs fire from the default branch (main).
  schedule:
    - cron: '0 3 * * 0'

permissions:
  actions: write   # delete caches + trigger sibling workflow

jobs:
  purge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Purge incremental build cache
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "🗑️  Searching for incremental-build-cache-* entries..."
        IDS=$(gh cache list --limit 100 --key incremental-build-cache --json id --jq '.[].id' || echo "")
        if [ -z "$IDS" ]; then
          echo "ℹ️  No incremental-build-cache-* entries to delete."
        else
          echo "$IDS" | while read -r id; do
            [ -z "$id" ] && continue
            if gh cache delete "$id" >/dev/null 2>&1; then
              echo "  ✓ deleted $id"
            else
              echo "  ⚠️  failed to delete $id"
            fi
          done
        fi

    - name: Purge image optimization cache
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "🗑️  Searching for build-cache-avif-v3-* entries..."
        IDS=$(gh cache list --limit 100 --key build-cache-avif-v3 --json id --jq '.[].id' || echo "")
        if [ -z "$IDS" ]; then
          echo "ℹ️  No build-cache-avif-v3-* entries to delete."
        else
          echo "$IDS" | while read -r id; do
            [ -z "$id" ] && continue
            if gh cache delete "$id" >/dev/null 2>&1; then
              echo "  ✓ deleted $id"
            else
              echo "  ⚠️  failed to delete $id"
            fi
          done
        fi

    - name: Purge raw pre-transform HTML snapshot
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "🗑️  Searching for raw-html-snapshot-* entries..."
        IDS=$(gh cache list --limit 100 --key raw-html-snapshot --json id --jq '.[].id' || echo "")
        if [ -z "$IDS" ]; then
          echo "ℹ️  No raw-html-snapshot-* entries to delete."
        else
          echo "$IDS" | while read -r id; do
            [ -z "$id" ] && continue
            if gh cache delete "$id" >/dev/null 2>&1; then
              echo "  ✓ deleted $id"
            else
              echo "  ⚠️  failed to delete $id"
            fi
          done
        fi

    - name: Trigger main deploy workflow
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "🚀 Triggering deploy-static-site.yml on main..."
        # force_static_purge: the static-asset purge is normally gated on a
        # diff of favicons/webmanifest/fonts. That gate is right for an
        # incremental deploy, but a no-cache rebuild regenerates every asset
        # from source — exactly the run where an edge copy is most likely to
        # be stale in a way the diff can't see (subset fonts are served
        # `immutable` for a year). Purge unconditionally here.
        gh workflow run deploy-static-site.yml --ref main -f force_static_purge=true
        echo ""
        echo "✅ Triggered. The deploy uses the same concurrency group as a"
        echo "   manual run, so if a deploy is already in flight this one"
        echo "   queues behind it. Watch progress with:"
        echo "     gh run list --workflow=deploy-static-site.yml --limit 3"
        echo "     gh run watch"
